<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101d3d" />
  <title>Вход — GoLab</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro">
      <a class="brand" href="index.html"><span class="logo-mark" aria-hidden="true">G</span> GoLab</a>
      <div class="intro-copy"><p class="intro-kicker">Ваше пространство</p><h1>Рады видеть вас снова.</h1><p>Войдите в аккаунт, чтобы продолжить работу.</p></div>
      <span class="intro-bottom">GoLab</span>
    </section>
    <section class="form-side" aria-labelledby="login-title">
      <div class="form-wrap">
        <h2 id="login-title">Вход в аккаунт</h2>
        <p class="subtitle">Введите свои данные для входа.</p>
        <form id="login-form">
          <label for="login">Логин</label>
          <input id="login" name="login" type="text" autocomplete="username" required maxlength="50" />
          <label for="password">Пароль</label>
          <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="50" /><button type="button" id="toggle-password" class="toggle-pass" aria-label="Показать пароль">Показать</button></div>
          <div class="notice" id="notice" role="alert" hidden></div>
          <button id="submit" class="button primary" type="submit">Войти</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
