<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f5f7fb">
<title>Каталог — GoLab</title><link rel="stylesheet" href="style.css"><script src="products.js" defer></script>
</head>
<body class="site-page">
<header class="site-header"><div class="header-inner"><a class="brand dark-brand" href="dashboard.html"><span class="logo-mark" aria-hidden="true">G</span> GoLab</a><nav aria-label="Основная навигация"><a href="dashboard.html">Главная</a><a href="users.html">Пользователи</a><a href="products.html" aria-current="page">Каталог</a></nav></div></header>
<main class="page-content catalog"><div class="catalog-heading"><div><h1>Техника на каждый день.</h1><p class="page-description">Смартфоны, ноутбуки и аксессуары.</p></div><label class="catalog-search" for="product-search">Найти товар<input id="product-search" type="search" placeholder="Название товара" autocomplete="off"></label></div>
<div class="catalog-actions"><button class="button primary" id="open-product-dialog" type="button">Добавить продукт</button><p id="product-feedback" role="status"></p></div><div class="catalog-toolbar"><p id="product-count" role="status">Загрузка…</p><label for="product-sort">Сортировка<select id="product-sort"><option value="default">По умолчанию</option><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option></select></label></div>
<p id="products-status" role="status">Загружаем товары…</p><button id="products-retry" type="button" class="button secondary" hidden>Попробовать снова</button><div id="products-grid" class="products-grid" aria-label="Товары"></div>
</main>
<dialog id="product-dialog" class="product-dialog" aria-labelledby="product-dialog-title">
<div class="dialog-heading"><h2 id="product-dialog-title">Добавить продукт</h2><button id="close-product-dialog" class="dialog-close" type="button" aria-label="Закрыть">Закрыть</button></div>
<form id="add-product-form">
<label for="product-name">Название</label><input id="product-name" name="name" required maxlength="150" autocomplete="off" autofocus>
<label for="product-price">Цена, ₸</label><input id="product-price" name="price" type="number" min="1" step="1" required inputmode="numeric">
<p id="add-product-error" class="notice" role="alert" hidden></p>
<div class="dialog-actions"><button id="cancel-product" class="button secondary" type="button">Отмена</button><button id="save-product" class="button primary" type="submit">Добавить</button></div>
</form></dialog>
</body></html>
